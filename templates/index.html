<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapflix NAS</title>
    <script src="//unpkg.com/alpinejs" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .glass-panel {
            background: rgba(31, 41, 55, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .poster-card { transition: transform .15s ease, box-shadow .15s ease; }
        .poster-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
        [x-cloak] { display: none !important; }
        .fade-in { animation: fade .2s ease; }
        @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased overflow-x-hidden">
    <div id="vanta-bg" class="fixed inset-0 z-0"></div>

    <div class="relative z-10 container mx-auto p-4 max-w-6xl min-h-screen flex flex-col" x-data="app()" x-init="init()">
        <!-- Header -->
        <header class="mb-6 flex justify-between items-center glass-panel p-4 rounded-lg shadow-lg">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                    ⚡ Zapflix
                </h1>
                <div class="text-sm text-gray-400">NAS Edition · Real-Debrid
                    <span class="text-gray-600" x-show="status.version" x-text="'· v' + status.version"></span>
                </div>
            </div>
            <div class="text-right text-xs text-gray-400 space-y-1">
                <div x-text="status.config_found ? '✅ Config Loaded' : '❌ Config Missing'"></div>
                <div :class="status.clients?.rd ? 'text-green-500 font-bold' : 'text-gray-600'"
                     x-text="status.clients?.rd ? 'RD Active' : 'RD Inactive'"></div>
                <div :class="status.clients?.aria2 ? 'text-green-500' : 'text-gray-600'"
                     x-text="status.clients?.aria2 ? 'aria2 → NAS' : 'aria2 off'"></div>
            </div>
        </header>

        <!-- Search -->
        <div class="mb-6 glass-panel p-4 rounded-lg shadow-xl">
            <form @submit.prevent="search" class="flex gap-2">
                <input type="text" x-model="query" placeholder="Search movies or series (e.g. 'Teen Wolf')..."
                       class="flex-1 p-3 rounded bg-gray-800 bg-opacity-50 border border-gray-600 focus:outline-none focus:border-blue-500 text-white placeholder-gray-400 transition">
                <button type="submit" :disabled="searching"
                        class="px-6 py-3 bg-blue-600 rounded font-semibold shadow hover:bg-blue-700 transition disabled:opacity-50">
                    <span x-text="searching ? 'Searching…' : 'Search'"></span>
                </button>
            </form>
        </div>

        <!-- Poster grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8 fade-in"
             x-show="results.length > 0 && view === 'catalog'">
            <template x-for="item in results" :key="item.imdb_id">
                <div @click="openDetail(item)"
                     class="poster-card cursor-pointer glass-panel rounded-lg overflow-hidden flex flex-col">
                    <div class="relative bg-gray-800" style="padding-bottom:150%;">
                        <img :src="item.poster" :alt="item.name" loading="lazy"
                             @error="$el.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22><rect width=%22200%22 height=%22300%22 fill=%22%23374151%22/></svg>'"
                             class="absolute inset-0 w-full h-full object-cover">
                        <span class="absolute top-2 left-2 text-xs font-bold px-2 py-1 rounded"
                              :class="item.type === 'movie' ? 'bg-green-600' : 'bg-purple-600'"
                              x-text="item.type?.toUpperCase()"></span>
                    </div>
                    <div class="p-2">
                        <div class="font-semibold text-sm leading-tight truncate" x-text="item.name" :title="item.name"></div>
                        <div class="text-xs text-gray-400" x-text="item.year"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Detail view -->
        <div x-show="view === 'detail'" x-cloak class="mb-8 fade-in">
            <button @click="closeDetail()" class="mb-3 text-sm text-blue-400 hover:text-blue-300">← Back to results</button>
            <div class="glass-panel rounded-lg overflow-hidden shadow-2xl">
                <!-- Backdrop -->
                <div class="h-40 md:h-56 bg-cover bg-center"
                     :style="detail.data && detail.data.background ? `background-image:linear-gradient(to top, rgba(17,24,39,1), rgba(17,24,39,.35)), url('${detail.data.background}')` : 'background:#1f2937'"></div>
                <div class="p-5 -mt-20 relative flex flex-col md:flex-row gap-5">
                    <img x-show="detail.data && detail.data.poster" :src="detail.data && detail.data.poster"
                         class="w-32 md:w-44 rounded-lg shadow-lg flex-shrink-0 border border-gray-700">
                    <div class="flex-1 min-w-0">
                        <template x-if="detail.loading">
                            <div class="text-gray-400 mt-16">Loading details…</div>
                        </template>
                        <template x-if="!detail.loading && detail.data">
                            <div>
                                <h2 class="text-2xl md:text-3xl font-bold" x-text="detail.data.name"></h2>
                                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 mt-1">
                                    <span x-text="detail.data.year"></span>
                                    <span x-show="detail.data.rating" class="text-yellow-400 font-bold">★ <span x-text="detail.data.rating"></span></span>
                                    <span x-show="detail.data.runtime" x-text="detail.data.runtime"></span>
                                    <span class="text-xs px-2 py-0.5 rounded"
                                          :class="detail.data.type === 'movie' ? 'bg-green-700' : 'bg-purple-700'"
                                          x-text="detail.data.type?.toUpperCase()"></span>
                                </div>
                                <div class="mt-1 text-xs text-gray-400" x-text="(detail.data.genres||[]).join(' · ')"></div>
                                <p class="mt-3 text-sm text-gray-300 leading-relaxed max-h-32 overflow-y-auto" x-text="detail.data.description"></p>

                                <!-- Movie: destination + single button -->
                                <template x-if="detail.data.type === 'movie'">
                                    <div class="mt-4 flex items-center gap-2">
                                        <select x-show="status.library?.folders?.length" x-model="destFolder" x-effect="destFolder; $nextTick(() => $el.value = destFolder)"
                                                title="Destination folder on the NAS"
                                                class="px-3 py-3 rounded bg-gray-800 border border-gray-600 text-sm focus:outline-none focus:border-blue-500">
                                            <option value="">📁 (library root)</option>
                                            <template x-for="f in status.library?.folders || []" :key="f">
                                                <option :value="f" x-text="'📁 ' + f"></option>
                                            </template>
                                        </select>
                                        <button @click="startDownload()" :disabled="downloading"
                                                class="px-6 py-3 bg-green-600 rounded font-bold shadow hover:bg-green-700 transition disabled:opacity-50">
                                            <span x-text="downloading ? 'Queued ✓' : '⬇ Download Movie'"></span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Series: season/episode selection -->
                <template x-if="!detail.loading && detail.data && detail.data.type === 'series'">
                    <div class="px-5 pb-5">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-t border-gray-700 pt-4 mb-3">
                            <div class="flex items-center gap-2">
                                <button @click="toggleAll(true)" class="text-xs px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">Select all</button>
                                <button @click="toggleAll(false)" class="text-xs px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">Clear</button>
                                <span class="text-xs text-gray-400" x-text="selectedCount() + ' episode(s) selected'"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <select x-show="status.library?.folders?.length" x-model="destFolder" x-effect="destFolder; $nextTick(() => $el.value = destFolder)"
                                        title="Destination folder on the NAS (also used for monitored grabs)"
                                        class="px-3 py-2 rounded bg-gray-800 border border-gray-600 text-sm focus:outline-none focus:border-blue-500">
                                    <option value="">📁 (library root)</option>
                                    <template x-for="f in status.library?.folders || []" :key="f">
                                        <option :value="f" x-text="'📁 ' + f"></option>
                                    </template>
                                </select>
                                <button @click="toggleMonitor()"
                                        :class="isMonitored(detail.item?.imdb_id) ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-gray-700 hover:bg-gray-600'"
                                        class="px-4 py-2 rounded font-bold shadow transition"
                                        title="Auto-download new episodes as they air">
                                    <span x-text="isMonitored(detail.item?.imdb_id) ? '🔔 Monitoring' : '🔕 Monitor'"></span>
                                </button>
                                <button @click="startDownload()" :disabled="downloading || selectedCount()===0"
                                        class="px-5 py-2 bg-green-600 rounded font-bold shadow hover:bg-green-700 transition disabled:opacity-40">
                                    <span x-text="downloading ? 'Queued ✓' : '⬇ Download selected'"></span>
                                </button>
                            </div>
                        </div>

                        <template x-for="s in detail.data.seasons" :key="s.season">
                            <div class="mb-2 bg-gray-800 bg-opacity-40 rounded">
                                <div class="flex items-center justify-between px-3 py-2 cursor-pointer" @click="toggleExpand(s.season)">
                                    <div class="flex items-center gap-2">
                                        <input type="checkbox" :checked="isSeasonAll(s.season)" @click.stop="toggleSeason(s.season)"
                                               class="w-4 h-4 accent-green-500">
                                        <span class="font-semibold text-sm">Season <span x-text="s.season"></span></span>
                                        <span class="text-xs text-gray-500" x-text="'· ' + s.episodes.length + ' ep'"></span>
                                    </div>
                                    <span class="text-gray-400 text-xs" x-text="expanded[s.season] ? '▲' : '▼'"></span>
                                </div>
                                <div x-show="expanded[s.season]" class="px-3 pb-3 grid grid-cols-1 sm:grid-cols-2 gap-1">
                                    <template x-for="ep in s.episodes" :key="ep.episode">
                                        <label class="flex items-center gap-2 text-xs text-gray-300 py-1 px-2 rounded hover:bg-gray-700 cursor-pointer">
                                            <input type="checkbox" :checked="isEpisodeSelected(s.season, ep.episode)"
                                                   @change="toggleEpisode(s.season, ep.episode)" class="w-4 h-4 accent-green-500">
                                            <span class="text-gray-500" x-text="'E'+String(ep.episode).padStart(2,'0')"></span>
                                            <span class="truncate" x-text="ep.name" :title="ep.name"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- Monitored shows -->
        <div class="mb-6 glass-panel rounded-lg shadow-2xl overflow-hidden" x-show="monitored.length > 0" x-cloak>
            <div class="bg-gray-800 bg-opacity-80 px-4 py-2 text-xs text-gray-400 border-b border-gray-700 flex justify-between items-center">
                <span>🔔 MONITORED SHOWS <span class="text-gray-600" x-text="'· ' + monitored.length"></span></span>
                <button @click="checkNow()" class="text-blue-300 hover:text-blue-100 transition font-semibold">Check now</button>
            </div>
            <div class="p-3 space-y-1.5 max-h-48 overflow-y-auto">
                <template x-for="m in monitored" :key="m.imdb_id">
                    <div class="flex justify-between items-center gap-3 text-xs">
                        <div class="min-w-0">
                            <span class="text-gray-200 font-semibold" x-text="m.name"></span>
                            <span class="text-gray-500 ml-2"
                                  x-text="m.last_grab ? ('last grab ' + m.last_grab) : 'waiting for new episodes'"></span>
                        </div>
                        <div class="whitespace-nowrap space-x-3 text-gray-500">
                            <span x-text="m.last_check ? ('checked ' + new Date(m.last_check * 1000).toLocaleString()) : 'not checked yet'"></span>
                            <button @click="unmonitor(m)" class="px-2 py-0.5 bg-gray-700 rounded hover:bg-red-700 transition" title="Stop monitoring">✕</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- NAS Downloads (aria2) -->
        <div class="mb-6 glass-panel rounded-lg shadow-2xl overflow-hidden" x-show="downloads.length > 0" x-cloak>
            <div class="bg-gray-800 bg-opacity-80 px-4 py-2 text-xs text-gray-400 border-b border-gray-700 flex justify-between items-center">
                <span>NAS DOWNLOADS <span class="text-gray-600">· aria2</span></span>
                <span>
                    <span class="text-blue-400" x-text="countBy('active') + ' active'"></span>
                    <span class="text-yellow-400 ml-2" x-show="countBy('waiting')" x-text="countBy('waiting') + ' queued'"></span>
                    <span class="text-green-500 ml-2" x-show="countBy('complete')" x-text="countBy('complete') + ' done'"></span>
                    <span class="text-red-400 ml-2" x-show="countBy('error')" x-text="countBy('error') + ' failed'"></span>
                </span>
            </div>
            <div class="p-3 space-y-2 max-h-80 overflow-y-auto">
                <template x-for="d in downloads" :key="d.gid">
                    <div class="text-xs">
                        <div class="flex justify-between items-center gap-3">
                            <span class="truncate text-gray-200" x-text="d.name" :title="d.name"></span>
                            <span class="whitespace-nowrap text-gray-400">
                                <template x-if="d.status === 'active'">
                                    <span><span x-text="fmtBytes(d.speed) + '/s'"></span> · <span x-text="fmtEta(d.eta)"></span></span>
                                </template>
                                <span x-show="d.status === 'waiting'" class="text-yellow-400">queued</span>
                                <span x-show="d.status === 'complete'" class="text-green-500">✓ <span x-text="fmtBytes(d.total)"></span></span>
                                <span x-show="d.status === 'error'" class="text-red-400" :title="d.error">✗ failed</span>
                            </span>
                        </div>
                        <div class="h-1.5 bg-gray-700 bg-opacity-60 rounded mt-1 overflow-hidden">
                            <div class="h-full rounded transition-all duration-500"
                                 :class="d.status === 'error' ? 'bg-red-500' : (d.status === 'complete' ? 'bg-green-500' : 'bg-blue-500')"
                                 :style="'width:' + Math.max(d.progress, 2) + '%'"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Failed files (retryable) -->
        <div class="mb-6 glass-panel rounded-lg shadow-2xl overflow-hidden border border-red-900" x-show="failures.length > 0" x-cloak>
            <div class="bg-red-900 bg-opacity-30 px-4 py-2 text-xs text-red-300 border-b border-red-900 flex justify-between items-center">
                <span>FAILED FILES <span class="text-red-400 font-bold" x-text="'· ' + failures.length"></span></span>
                <span class="space-x-3">
                    <button @click="retryAllFailures()" :disabled="retrying"
                            class="text-blue-300 hover:text-blue-100 transition font-semibold disabled:opacity-50">
                        <span x-text="retrying ? 'Retrying…' : '🔁 Retry all'"></span>
                    </button>
                    <button @click="clearFailures()" class="text-gray-400 hover:text-white transition">Clear all</button>
                </span>
            </div>
            <div class="p-3 space-y-2 max-h-60 overflow-y-auto">
                <template x-for="f in failures" :key="f.id">
                    <div class="flex justify-between items-center gap-3 text-xs">
                        <div class="min-w-0">
                            <div class="truncate text-gray-200" x-text="f.filename" :title="f.filename"></div>
                            <div class="text-gray-500">
                                <span x-text="f.content_name"></span> ·
                                <span class="text-red-400" x-text="f.reason"></span> ·
                                <span x-text="new Date(f.ts * 1000).toLocaleString()"></span>
                            </div>
                        </div>
                        <div class="whitespace-nowrap space-x-2">
                            <button @click="retryFailure(f)" :disabled="retrying"
                                    class="px-2 py-1 bg-blue-600 rounded font-semibold hover:bg-blue-700 transition disabled:opacity-50">Retry</button>
                            <button @click="dismissFailure(f)"
                                    class="px-2 py-1 bg-gray-700 rounded hover:bg-gray-600 transition" title="Dismiss">✕</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Logs -->
        <div class="flex-grow flex flex-col glass-panel rounded-lg shadow-2xl overflow-hidden mb-4 min-h-0">
            <div class="bg-gray-800 bg-opacity-80 px-4 py-2 text-xs text-gray-400 border-b border-gray-700 flex justify-between items-center">
                <span>SYSTEM LOGS</span>
                <button @click="clearLogs()" class="hover:text-white transition">Clear</button>
            </div>
            <div class="p-4 font-mono text-xs md:text-sm h-64 overflow-y-auto" id="log-container">
                <template x-for="(log, idx) in logs" :key="idx">
                    <div class="mb-1 break-words pb-1 border-b border-gray-800 border-opacity-30 last:border-0"
                         :class="log.includes('❌') ? 'text-red-400' : ((log.includes('✅') || log.includes('🚀') || log.includes('✨')) ? 'text-green-400' : 'text-gray-300')"
                         x-text="log"></div>
                </template>
                <div x-show="logs.length === 0" class="text-gray-500 italic text-center mt-10">Waiting for tasks…</div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                query: '', results: [], logs: [], status: {}, logInterval: null,
                downloads: [], failures: [], retrying: false,
                monitored: [], destFolder: '',
                searching: false, downloading: false,
                view: 'catalog',
                detail: { loading: false, data: null, item: null },
                selected: {},   // key "season-episode" -> true
                expanded: {},   // season -> bool
                backgrounds: ['net', 'clouds', 'cells'],
                currentBg: null, vantaEffect: null, bgTimer: null,

                async init() {
                    this.fetchStatus();
                    this.startLogPolling();
                    this.startBackgroundRoulette();
                },

                // ── Background roulette (Vanta.js) ─────────────────────────
                pickBackground(exclude) {
                    const pool = this.backgrounds.filter(b => b !== exclude);
                    return pool[Math.floor(Math.random() * pool.length)];
                },

                setBackground(name) {
                    try {
                        if (this.vantaEffect) { this.vantaEffect.destroy(); this.vantaEffect = null; }
                        const common = { el: "#vanta-bg", mouseControls: true, touchControls: true,
                                         gyroControls: false, minHeight: 200, minWidth: 200,
                                         scale: 1, scaleMobile: 1 };
                        if (name === 'clouds') {
                            // Night-sky tuning to match the dark theme
                            this.vantaEffect = VANTA.CLOUDS({ ...common,
                                backgroundColor: 0x111827, skyColor: 0x0b1226,
                                cloudColor: 0x1e293b, cloudShadowColor: 0x070b14,
                                sunColor: 0x1d4ed8, sunGlareColor: 0x2563eb,
                                sunlightColor: 0x1e40af, speed: 0.8 });
                        } else if (name === 'cells') {
                            this.vantaEffect = VANTA.CELLS({ ...common,
                                color1: 0x111827, color2: 0x1d4ed8,
                                size: 2.5, speed: 1.0 });
                        } else {
                            this.vantaEffect = VANTA.NET({ ...common,
                                color: 0x3b82f6, backgroundColor: 0x111827,
                                points: 15, maxDistance: 22, spacing: 16 });
                        }
                        this.currentBg = name;
                    } catch (e) { console.warn("Vanta failed", e); }
                },

                startBackgroundRoulette() {
                    this.setBackground(this.pickBackground());          // random on load
                    this.bgTimer = setInterval(
                        () => this.setBackground(this.pickBackground(this.currentBg)),  // always switch
                        30 * 60 * 1000);                                // every 30 minutes
                },

                async fetchStatus() {
                    try { this.status = await (await fetch('/api/status')).json(); }
                    catch (e) { console.error(e); }
                },

                async search() {
                    if (!this.query) return;
                    this.searching = true; this.view = 'catalog';
                    try {
                        const res = await fetch(`/api/search?q=${encodeURIComponent(this.query)}`);
                        this.results = (await res.json()).filter(r => r.type !== 'error');
                    } catch (e) { this.pushLog("❌ Search failed: " + e); }
                    this.searching = false;
                },

                async openDetail(item) {
                    this.view = 'detail';
                    this.detail = { loading: true, data: null, item };
                    this.selected = {}; this.expanded = {};
                    // Preselect the configured library folder for this type
                    this.destFolder = (item.type === 'movie'
                        ? this.status.library?.default_movie
                        : this.status.library?.default_series) || '';
                    try {
                        const res = await fetch(`/api/meta/${item.type}/${item.imdb_id}`);
                        const data = await res.json();
                        this.detail.data = data;
                        if (data.type === 'series') {
                            this.toggleAll(true);   // default: everything selected
                            if (data.seasons && data.seasons.length) this.expanded[data.seasons[0].season] = true;
                        }
                    } catch (e) { this.pushLog("❌ Failed to load details: " + e); }
                    this.detail.loading = false;
                },

                closeDetail() { this.view = 'catalog'; this.detail = { loading: false, data: null, item: null }; },

                toggleExpand(s) { this.expanded[s] = !this.expanded[s]; },

                key(s, e) { return s + '-' + e; },
                isEpisodeSelected(s, e) { return !!this.selected[this.key(s, e)]; },

                toggleEpisode(s, e) {
                    const k = this.key(s, e);
                    if (this.selected[k]) delete this.selected[k]; else this.selected[k] = true;
                    this.selected = { ...this.selected };
                },

                seasonObj(s) { return this.detail.data.seasons.find(x => x.season === s); },
                isSeasonAll(s) {
                    const so = this.seasonObj(s); if (!so) return false;
                    return so.episodes.every(ep => this.isEpisodeSelected(s, ep.episode));
                },
                toggleSeason(s) {
                    const so = this.seasonObj(s); if (!so) return;
                    const all = this.isSeasonAll(s);
                    so.episodes.forEach(ep => {
                        const k = this.key(s, ep.episode);
                        if (all) delete this.selected[k]; else this.selected[k] = true;
                    });
                    this.selected = { ...this.selected };
                },
                toggleAll(on) {
                    this.selected = {};
                    if (on && this.detail.data && this.detail.data.seasons) {
                        this.detail.data.seasons.forEach(so =>
                            so.episodes.forEach(ep => this.selected[this.key(so.season, ep.episode)] = true));
                    }
                    this.selected = { ...this.selected };
                },
                selectedCount() { return Object.keys(this.selected).length; },

                buildSelection() {
                    if (this.detail.data.type === 'movie') return null;
                    const bySeason = {};
                    Object.keys(this.selected).forEach(k => {
                        const parts = k.split('-').map(Number);
                        const s = parts[0], e = parts[1];
                        (bySeason[s] = bySeason[s] || []).push(e);
                    });
                    return Object.keys(bySeason).map(s => ({ season: Number(s), episodes: bySeason[s].sort((a,b)=>a-b) }));
                },

                async startDownload() {
                    const d = this.detail.data; if (!d) return;
                    if (d.type === 'series' && this.selectedCount() === 0) return;
                    this.downloading = true;
                    const selection = this.buildSelection();
                    this.pushLog(`[UI] Requesting download for ${d.name}…`);
                    try {
                        await fetch('/api/download', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ imdb_id: d.imdb_id, type: d.type, selection,
                                                   folder: this.destFolder })
                        });
                    } catch (e) { this.pushLog("❌ Request failed: " + e); }
                    setTimeout(() => this.downloading = false, 2500);
                },

                pushLog(m) { this.logs.push(m); },
                clearLogs() { this.logs = []; },

                // ── NAS downloads panel (aria2) ─────────────────────────────
                async fetchDownloads() {
                    try {
                        this.downloads = await (await fetch('/api/downloads')).json();
                    } catch (e) { /* aria2 unreachable — keep last known list */ }
                },
                countBy(status) { return this.downloads.filter(d => d.status === status).length; },

                // ── New-episode monitoring ──────────────────────────────────
                async fetchMonitored() {
                    try {
                        this.monitored = await (await fetch('/api/monitored')).json();
                    } catch (e) { /* keep last known list */ }
                },
                isMonitored(imdbId) {
                    return !!imdbId && this.monitored.some(m => m.imdb_id === imdbId);
                },
                async toggleMonitor() {
                    const id = this.detail.item?.imdb_id;
                    if (!id) return;
                    try {
                        if (this.isMonitored(id)) {
                            await fetch(`/api/monitored/${id}`, { method: 'DELETE' });
                            this.pushLog(`🔕 Stopped monitoring ${this.detail.item.name}`);
                        } else {
                            const res = await (await fetch(
                                `/api/monitored/${id}?folder=${encodeURIComponent(this.destFolder)}`,
                                { method: 'POST' })).json();
                            this.pushLog((res.ok ? '🔔 ' : '❌ ') + res.message);
                        }
                    } catch (e) { this.pushLog('❌ Monitor request failed: ' + e); }
                    this.fetchMonitored();
                },
                async unmonitor(m) {
                    try { await fetch(`/api/monitored/${m.imdb_id}`, { method: 'DELETE' }); } catch (e) {}
                    this.pushLog(`🔕 Stopped monitoring ${m.name}`);
                    this.fetchMonitored();
                },
                async checkNow() {
                    try {
                        await fetch('/api/monitored-check', { method: 'POST' });
                        this.pushLog('🔔 Manual monitoring check started…');
                    } catch (e) { this.pushLog('❌ Check request failed: ' + e); }
                },

                // ── Failed files panel ──────────────────────────────────────
                async fetchFailures() {
                    try {
                        this.failures = await (await fetch('/api/failures')).json();
                    } catch (e) { /* backend unreachable — keep last known list */ }
                },
                async retryFailure(f) {
                    this.retrying = true;
                    try {
                        const res = await (await fetch(`/api/failures/${f.id}/retry`, { method: 'POST' })).json();
                        this.pushLog((res.ok ? '🔁 ' : '❌ ') + res.message);
                    } catch (e) { this.pushLog('❌ Retry request failed: ' + e); }
                    this.retrying = false;
                    this.fetchFailures();
                },
                async retryAllFailures() {
                    this.retrying = true;
                    for (const f of [...this.failures]) {
                        try {
                            const res = await (await fetch(`/api/failures/${f.id}/retry`, { method: 'POST' })).json();
                            this.pushLog((res.ok ? '🔁 ' : '❌ ') + res.message);
                        } catch (e) { this.pushLog('❌ Retry request failed: ' + e); }
                    }
                    this.retrying = false;
                    this.fetchFailures();
                },
                async dismissFailure(f) {
                    try { await fetch(`/api/failures/${f.id}`, { method: 'DELETE' }); } catch (e) {}
                    this.fetchFailures();
                },
                async clearFailures() {
                    if (!confirm('Clear all failed entries? They can no longer be retried afterwards.')) return;
                    try { await fetch('/api/failures', { method: 'DELETE' }); } catch (e) {}
                    this.fetchFailures();
                },
                fmtBytes(n) {
                    if (!n && n !== 0) return '?';
                    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
                    let i = 0; n = Number(n);
                    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
                    return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
                },
                fmtEta(s) {
                    if (s == null) return '…';
                    if (s < 60) return s + 's';
                    if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
                    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
                },

                async fetchLogs() {
                    try {
                        const newLogs = await (await fetch('/api/logs')).json();
                        if (JSON.stringify(newLogs) !== JSON.stringify(this.logs)) {
                            this.logs = newLogs;
                            this.$nextTick(() => {
                                const c = document.getElementById('log-container');
                                if (c) c.scrollTop = c.scrollHeight;
                            });
                        }
                    } catch (e) { console.error(e); }
                },
                startLogPolling() {
                    if (this.logInterval) return;
                    this.fetchLogs();
                    this.fetchDownloads();
                    this.fetchFailures();
                    this.fetchMonitored();
                    this.logInterval = setInterval(() => {
                        this.fetchLogs();
                        this.fetchDownloads();
                        if (Math.random() > 0.7) this.fetchFailures();
                        if (Math.random() > 0.8) this.fetchMonitored();
                        if (Math.random() > 0.9) this.fetchStatus();
                    }, 2000);
                }
            }
        }
    </script>
</body>
